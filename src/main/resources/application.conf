markdown-slides {
  # Only the loopback interface by default : listen on "0.0.0.0" so that participants follow a live presentation from
  # their own devices
  listen {
    host = "127.0.0.1"
    host = ${?MARKDOWN_SLIDES_LISTEN_HOST}
    port = 8048
    port = ${?MARKDOWN_SLIDES_LISTEN_PORT}
  }

  # Database (LMDB, the single source of truth), thumbnails and PDF exports caches
  data-directory = ${user.home}"/.markdown-slides"
  data-directory = ${?MARKDOWN_SLIDES_DATA_DIRECTORY}

  # The directories holding the presentations (git working trees or plain directories), comma separated. Each markdown
  # file is a deck, each directory holding decks a presentation.
  sources = ${user.home}"/slides"
  sources = ${?MARKDOWN_SLIDES_SOURCES}

  # Never scanned, glob patterns relative to a source directory, comma separated
  excludes = "**/node_modules/**,**/target/**,**/.direnv/**,**/.idea/**"
  excludes = ${?MARKDOWN_SLIDES_EXCLUDES}

  # How often the sources are checked for changes : the open views are updated right after
  scan-interval-seconds = 2
  scan-interval-seconds = ${?MARKDOWN_SLIDES_SCAN_INTERVAL_SECONDS}

  # Directories of reveal.js compatible themes (css files), comma separated, besides the built-in ones
  theme-directories = ""
  theme-directories = ${?MARKDOWN_SLIDES_THEME_DIRECTORIES}
  # The theme used until another one is chosen from the user interface (its file name without .css)
  default-theme = "orange-white"
  default-theme = ${?MARKDOWN_SLIDES_DEFAULT_THEME}

  # Slides size, as with reveal-md : the slides are scaled to fit the screen
  slide-width = 960
  slide-height = 700

  # Headless browser for the thumbnails and the PDF exports : a command of the PATH or an absolute path ; empty, the
  # user interface draws the thumbnails itself and the PDF exports are unavailable
  browser = "google-chrome"
  browser = ${?MARKDOWN_SLIDES_BROWSER}
  # Author written in the exported PDF
  pdf-author = ""
  pdf-author = ${?MARKDOWN_SLIDES_PDF_AUTHOR}

  # Search by meaning : any OpenAI compatible embeddings server (LocalAI, llama.cpp, vLLM, Ollama...) ; an empty model
  # keeps the search by words only. Unreachable, it is checked again later and the search uses words meanwhile.
  embeddings {
    base-url = "http://127.0.0.1:8081"
    base-url = ${?MARKDOWN_SLIDES_EMBEDDINGS_BASE_URL}
    model = "qwen3-embedding-0.6b"
    model = ${?MARKDOWN_SLIDES_EMBEDDINGS_MODEL}
    # the name of the environment variable holding the API key, if the server needs one
    api-key-variable = "MARKDOWN_SLIDES_EMBEDDINGS_API_KEY"
    # basic authentication, a proxy in front of the server for example : used instead of the API key when a username is
    # given ; the password is read from the environment variable named here
    username = ""
    username = ${?MARKDOWN_SLIDES_EMBEDDINGS_USERNAME}
    password-variable = "MARKDOWN_SLIDES_EMBEDDINGS_PASSWORD"
    timeout-seconds = 60
    batch-size = 16
  }
}
